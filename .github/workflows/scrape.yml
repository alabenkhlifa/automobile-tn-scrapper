name: Daily Car Data Scrape

on:
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC
  workflow_dispatch:      # Manual trigger

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # automobile.tn new cars are scraped on the Pi (deploy/pi/scrape_new_cars.sh):
      # the site returns 403 to GitHub runner IPs

      - name: Run 9annas used cars scraper
        run: python 9annas_scraper.py
        timeout-minutes: 30

      - name: Run AutoScout24 scraper (DE, FR, IT, BE - 600/market)
        run: python autoscout24_scraper.py --countries de,fr,it,be --max-listings 600 --max-age 8 --max-price 100000 --fuel-types "petrol,diesel,electric,hybrid,plug-in hybrid"
        timeout-minutes: 120

      - name: Build dashboard data
        run: python build_dashboard_data.py

      - name: Commit updated data
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add 9annas_tn_used_cars.json 9annas_tn_used_cars.csv autoscout24_*.json autoscout24_*.csv data/
          git diff --staged --quiet || git commit -m "Update car data - $(date -u +%Y-%m-%d)"
          git push

  check-new-cars:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail if the Pi stopped pushing new cars data
        run: |
          python3 - <<'EOF'
          import json, sys
          from datetime import datetime, timedelta
          with open("automobile_tn_new_cars.json", encoding="utf-8") as f:
              scraped_at = datetime.fromisoformat(json.load(f)["scraped_at"])
          age = datetime.now() - scraped_at
          print(f"automobile.tn new cars scraped {age.days} days ago ({scraped_at:%Y-%m-%d})")
          # Pi cron runs on the 1st and 15th, so the longest normal gap is 17 days
          if age > timedelta(days=18):
              sys.exit("::error::New cars data is older than 18 days - check the Pi cron job (deploy/pi/scrape_new_cars.sh)")
          EOF

  ingest:
    needs: scrape
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_TOKEN: ${{ secrets.SUPABASE_TOKEN }}
    steps:
      - name: Trigger Supabase ingestion
        if: env.SUPABASE_URL != ''  # skipped until SUPABASE_URL secret is set
        run: |
          curl -X POST "$SUPABASE_URL" \
            -H "Authorization: Bearer $SUPABASE_TOKEN" \
            --fail

  deploy:
    needs: scrape
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
